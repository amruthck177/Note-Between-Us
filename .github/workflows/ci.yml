name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint and type check (if any)
        run: npm run lint || echo "No lint script defined"

      - name: Run tests
        env:
          NODE_ENV: test
        run: npm test

      - name: Build production bundle
        run: npm run build